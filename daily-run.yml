name: Daily model refresh

# Runs the S&P 500 model once a day, so summary.csv and the event-study
# chart always reflect a fresh live data pull. Also runnable manually from
# the Actions tab via "Run workflow".
on:
  schedule:
    - cron: "0 13 * * *"  # 13:00 UTC every day (~9am US Eastern)
  workflow_dispatch: {}

permissions:
  contents: write  # needed so the job can commit the refreshed output files

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the model
        run: python main.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add summary.csv event_study_chart.png
          git diff --staged --quiet || git commit -m "Daily refresh: $(date -u +'%Y-%m-%d')"
          git push
